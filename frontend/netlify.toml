# Alternative to Vercel. In Netlify set the base directory to "frontend".
[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback so client-side routes (e.g. /teams/22) resolve to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Set VITE_API_BASE in the Netlify UI (Site settings -> Environment variables) to
# your backend URL + "/api", e.g. https://fifa-wc-api.onrender.com/api
